name: "Run"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]

jobs:
  analyze:
    name: "01 - Run Analyzer"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pylock.toml --no-deps
      - name: Run basic test
        run: |
          ./loganalyzer.py --url=https://obsproject.com/analyzer/test_logfile.txt
  ubuntu64:
    name: "02 - Code Format Check"
    runs-on: ubuntu-24.04
    if: always()
    needs: [analyze]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pylock.toml --no-deps
      - name: Annotate linting errors
        uses: marian-code/python-lint-annotate@ffff026d7d289bfdf5f149a510ebfefa4f9ae640
        with:
          python-root-list: "."
          use-black: false
          use-isort: false
          use-mypy: false
          use-pycodestyle: true
          use-pydocstyle: false
          use-pylint: false
          use-flake8: false
          use-vulture: false
          extra-pycodestyle-options: "--config=setup.cfg"
          python-version: '3.13'
      - name: Run pycodestyle
        # This is required because the annotate action doesn't trigger a failure
        run: |
          ./check_pep8.sh 1> /dev/null
